<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="left-side">
            <img class="background-img" src="./images/branden-skeli-ssVt_BoJV2U-unsplash.webp" alt="image of a bunch of gaming consoles">
            <div class="odin-container">
                <img class="logo" src="./images/odin-lined.webp" alt="Odin logo">
                <h1 class="odin-name">ODIN</h1>
            </div>
            <p class="credit">
                Photo by <a href="https://unsplash.com/@branden_skeli?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Branden Skeli</a> on <a href="https://unsplash.com/photos/game-console-and-controller-with-figurines-ssVt_BoJV2U?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </p>
        </div>
        <div class="right-side">
            <p class="bold text">This is not a real online service!
                You know you need something like this in your life to help
                realize yor deepest dreams. Sign up <span class="italic">now</span> to get started.
            </p>
            <p class="bold text">You <span class="italic">know</span> you want to.</p>
            <form action="">
                <div class="input-container">
                    <p class="bold text">Let's do this!</p>
                    <div class="labeled-inputs">
                        <div class="input-piece">
                            <label class="input-font" for="first-name">FIRST NAME</label>
                            <input id="first-name" type="text">
                        </div>
                        <div class="input-piece">
                            <label class="input-font" for="last-name">LAST NAME</label>
                            <input id="last-name" type="text">
                        </div>
                    </div>
    
                    <div class="labeled-inputs">
                        <div class="input-piece">
                            <label class="input-font" for="email">EMAIL</label>
                            <input id="email" type="text">
                        </div>
                        <div class="input-piece">
                            <label class="input-font" for="phone-number">PHONE NUMBER</label>
                            <input id="phone-number" type="text">
                        </div>
                    </div>
    
                    <div class="labeled-inputs">
                        <div class="input-piece">
                            <label class="input-font" for="password">PASSWORD</label>
                            <input id="password" type="text">
                        </div>
                        <div class="input-piece">
                            <label class="input-font" for="confirm-password">CONFIRM PASSWORD</label>
                            <input id="confirm-password" type="text">
                        </div>
                    </div>
                </div>
                <button class="small-font create-button">Create Account</button>
                <p>Already have an account? <a class="small-font bold login" href="#">Log in</a></p>
            </form>
        </div>
    </body>
</html>
